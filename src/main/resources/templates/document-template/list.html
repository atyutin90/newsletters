<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/head :: head}"></div>

<body class="bg-light d-flex flex-column min-vh-100">
<div th:replace="~{fragments/header :: header}"></div>

<main class="container flex-grow-1 py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="d-flex align-items-center gap-2">
            <h1 class="h3 mb-0" th:text="#{document-templates}">Document templates</h1>
            <span class="badge text-bg-secondary" th:text="${data.totalElements}">0</span>
        </div>
        <div class="btn-group" role="group">
            <a class="btn btn-outline-success btn-sm" th:href="@{/document-templates/new}" th:title="#{add}">
                <i class="fas fa-plus"></i>
            </a>
        </div>
    </div>

    <div th:replace="~{fragments/success-operation-message :: infoMessage(${infoMessage})}"></div>

    <form class="mb-3" method="get" th:action="@{/document-templates}">
        <input name="search" type="search" class="form-control" th:value="${filter.search}"
               th:placeholder="#{filter.search}" th:aria-label="#{filter.search}">
        <div class="d-flex justify-content-end mt-2">
            <button class="btn btn-outline-primary btn-sm" type="submit" th:title="#{filter.search}"
                    th:aria-label="#{filter.search}"><i class="fas fa-search"></i></button>
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/document-templates}"
               th:title="#{reset-search}" th:aria-label="#{reset-search}"><i class="fa-solid fa-broom"></i></a>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead>
            <tr>
                <th scope="col" th:text="#{id}"></th>
                <th scope="col" th:text="#{document-template.name}"></th>
                <th scope="col" th:text="#{document-template.type}"></th>
                <th scope="col" th:text="#{action}"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${data.isEmpty()}">
                <td colspan="4" class="text-center text-muted py-4" th:text="#{not-found-records}">No data</td>
            </tr>
            <tr th:each="value : ${data.content}">
                <th scope="row">[[${value.id}]]</th>
                <td th:text="${value.name}"></td>
                <td th:each="documentTemplateType : ${documentTemplateTypes}"
                    th:if="${documentTemplateType.getCode() == value.type}"
                    th:text="${documentTemplateType.getValue()}"></td>
                <td>
                    <a class="btn btn-outline-primary btn-sm"
                       th:href="@{/document-templates/{id}(id=${value.id})}" th:title="#{edit}"
                       th:aria-label="#{edit}"><i class="fas fa-pen"></i></a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div th:replace="~{fragments/paging :: paggination('/document-templates')}"></div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
