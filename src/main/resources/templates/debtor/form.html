<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/head :: head}"></div>

<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container flex-grow-1 py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0" th:text="${isEdit} ? #{update-debtor} : #{create-debtor}">Debtor</h1>
    </div>

    <div th:replace="~{fragments/success-operation-message :: infoMessage(${infoMessage})}"></div>
    <div th:replace="~{fragments/error-operation-message :: errorMessage(${error})}"></div>

    <div class="my-3">
        <form th:method="post" th:action="@{/debtors}" th:object="${debtor}">
            <input type="hidden" th:field="*{id}"/>
                <div class="row">
                    <div class="mb-3 col-md-12">
                        <label class="col-form-label" for="arbitrationManagerId" th:text="#{debtor.arbitration-manager}"></label>
                        <select class="form-select" id="arbitrationManagerId" th:field="*{arbitrationManagerId}">
                            <option th:if="${debtor.arbitrationManagerId == null}" selected th:value="${null}" th:text="#{choose}"></option>
                            <option th:each="arbitrationManager : ${arbitrationManagers}"
                                    th:value="${arbitrationManager.id}"
                                    th:text="${arbitrationManager.fullName}"></option>
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="mb-3 col-md-12">
                        <label class="col-form-label" for="name" th:text="#{debtor.arbitrationCase}"></label>
                        <div class="input-group mb-12">
                            <input type="text" th:field="*{arbitrationCase}" class="form-control" id="arbitrationCase"/>
                            <button class="btn btn-outline-secondary" type="button" th:text="#{open}" id="btnArbitrationCaseOpen"></button>
                            <button class="btn btn-outline-secondary" type="button" th:text="#{copy}" id="btnArbitrationCaseCopy"></button>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="mb-3 col-md-6">
                        <label class="col-form-label" for="name" th:text="#{debtor.name}"></label>
                        <input type="text" th:field="*{name}" required minlength="2" maxlength="128"
                               class="form-control" id="name"/>
                    </div>
                    <div class="mb-3 col-md-6">
                        <label class="col-form-label" for="fullName" th:text="#{debtor.full-name}"></label>
                        <input type="text" th:field="*{fullName}" class="form-control" id="fullName"/>
                    </div>
                </div>
                <div class="row">
                    <div class="mb-3 col-md-12">
                        <label class="col-form-label" for="address" th:text="#{debtor.address}"></label>
                        <input type="text" th:field="*{address}" class="form-control" id="address"/>
                        </div>
                </div>
                <div class="row">
                    <div class="mb-3 col-md-6">
                        <label class="col-form-label" for="caseNumber" th:text="#{debtor.case-number}"></label>
                        <input type="text" th:field="*{caseNumber}" class="form-control" id="caseNumber"/>
                    </div>
                    <div class="mb-3 col-md-6">
                        <label class="col-form-label" for="courtAct" th:text="#{debtor.court-act}"></label>
                        <input type="text" th:field="*{courtAct}" class="form-control" id="courtAct"/>
                    </div>
                </div>
                <div class="row">
                    <div class="mb-3 col-md-6">
                        <label class="col-form-label" for="actDate" th:text="#{debtor.act-date}"></label>
                        <input type="date" name="actDate" th:value="${debtor.actDate}" class="form-control"
                               id="actDate"/>
                    </div>
                    <div class="mb-3 col-md-6">
                        <label class="col-form-label"
                               for="resolutionDate"
                               th:text="#{debtor.resolution-date}">

                        </label>
                        <input type="date"
                               name="resolutionDate"
                               th:value="${debtor.resolutionDate}"
                               class="form-control"
                               id="resolutionDate"/>
                    </div>
                </div>
                <div class="row">
                    <div class="mb-3 col-md-6">
                        <label class="col-form-label"
                               for="taxRegistrationReasonCode"
                               th:text="#{debtor.tax-registration-reason-code}">
                        </label>
                        <input type="text"
                               th:field="*{taxRegistrationReasonCode}"
                               class="form-control"
                               id="taxRegistrationReasonCode"/>
                    </div>
                    <div class="mb-3 col-md-6">
                        <label class="col-form-label"
                               for="taxpayerIdentificationNumber"
                               th:text="#{debtor.taxpayer-identification-number}">
                        </label>
                        <input type="text"
                               th:field="*{taxpayerIdentificationNumber}"
                               class="form-control"
                               id="taxpayerIdentificationNumber"/>
                    </div>
                </div>
                <div class="row">
                    <div class="mb-3 col-md-6">
                        <label class="col-form-label"
                               for="primaryStateRegistrationNumber"
                               th:text="#{debtor.primary-state-registration-number}"></label>
                        <input type="text"
                               th:field="*{primaryStateRegistrationNumber}"
                               class="form-control"
                               id="primaryStateRegistrationNumber"/>
                    </div>
                    <div class="mb-3 col-md-6">
                        <label class="col-form-label"
                               for="documentNumber"
                               th:text="#{debtor.documentNumber}">
                        </label>
                        <input type="text"
                               th:field="*{documentNumber}"
                               class="form-control"
                               id="documentNumber"/>
                    </div>
                </div>

                <div class="row">
                    <div class="mb-3 col-md-6">
                        <label class="col-form-label" for="registryDate"
                               th:text="#{debtor.registry-date}"></label>
                        <input type="date" name="registryDate" th:value="${debtor.registryDate}" class="form-control"
                               id="registryDate"/>
                    </div>
                    <div class="mb-3 col-md-6">
                        <label class="col-form-label"
                               for="registryClosingDate"
                               th:text="#{debtor.registry-closing-date}">
                        </label>
                        <input type="date"
                               name="registryClosingDate"
                               th:value="${debtor.registryClosingDate}"
                               class="form-control"
                               id="registryClosingDate"/>
                    </div>
                </div>

            <div class="col-12 d-flex justify-content-center gap-2">
                <a class="btn btn-outline-secondary btn-sm" th:href="@{/debtors}" th:title="#{list}"
                   th:aria-label="#{list}"><i class="fas fa-list"></i></a>
                <button type="submit" class="btn btn-outline-success btn-sm" th:title="#{save}"
                        th:aria-label="#{save}"><i class="fas fa-save"></i></button>
                <button th:if="${isEdit}" type="button" class="btn btn-outline-danger btn-sm"
                        data-bs-toggle="modal" data-bs-target="#delete-modal" th:title="#{delete}"
                        th:aria-label="#{delete}"><i class="fas fa-trash"></i></button>
            </div>
        </form>

        <div th:if="${debtor?.id != null}" class="mt-4">
            <ul class="nav nav-pills mb-3" id="pills-tab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="pills-requests-tab" data-bs-toggle="pill"
                            data-bs-target="#pills-requests"
                            type="button"
                            role="tab"
                            aria-controls="pills-requests"
                            aria-selected="true"
                            th:text="#{debtor.requests}">
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="pills-creditors-tab" data-bs-toggle="pill"
                            data-bs-target="#pills-creditors"
                            type="button"
                            role="tab"
                            aria-controls="pills-creditors"
                            aria-selected="false"
                            th:text="#{debtor.creditors}">
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="pills-publications-tab" data-bs-toggle="pill"
                            data-bs-target="#pills-publications"
                            type="button"
                            role="tab"
                            aria-controls="pills-publications"
                            aria-selected="false"
                            th:text="#{debtor.publications}">
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="pills-debtor-meeting-tab" data-bs-toggle="pill"
                            data-bs-target="#pills-debtor-meeting"
                            type="button"
                            role="tab"
                            aria-controls="pills-debtor-meeting"
                            aria-selected="false"
                            th:text="#{debtor.debtor-meeting}">
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="pills-worker-meetings-tab" data-bs-toggle="pill"
                            data-bs-target="#pills-worker-meetings"
                            type="button"
                            role="tab"
                            aria-controls="pills-worker-meetings"
                            aria-selected="false"
                            th:text="#{debtor.worker-meeting}">
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="pills-documents-tab" data-bs-toggle="pill"
                            data-bs-target="#pills-documents"
                            type="button"
                            role="tab"
                            aria-controls="pills-documents"
                            aria-selected="false"
                            th:text="#{debtor.documents}">
                    </button>
                </li>
            </ul>
            <div class="tab-content" id="pills-tabContent">
                <div class="tab-pane fade show active"
                     id="pills-requests"
                     role="tabpanel"
                     aria-labelledby="pills-requests-tab">
                    <div class="text-start">
                        <a th:href="@{/debtors/{debtorId}/requests/new(debtorId=${debtor.getId()})}"
                           th:title="#{debtor.request.creation}"
                           class="btn btn-outline-success btn-sm">
                            <i class="fas fa-plus"></i>
                        </a>
                    </div>
                    <fieldset class="border p-2">
                        <legend class="float-none w-auto p-2" th:text="#{requests}"></legend>

                        <table class="table">
                            <thead class="table-light">
                            <tr>
                                <th scope="col" th:text="#{debtor.request.id}"></th>
                                <th scope="col" th:text="#{debtor.request.destinationId}"></th>
                                <th scope="col" th:text="#{debtor.request.date}"></th>
                                <th scope="col" th:text="#{debtor.request.dateFrom}"></th>
                                <th scope="col" th:text="#{debtor.request.dateTo}"></th>
                                <th scope="col" th:text="#{action}"></th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="request : ${requests}">
                                <td th:text="${request.id}"></td>
                                <td
                                    th:each="requestDestination : ${requestDestinations}"
                                    th:if="${requestDestination.id == request.destinationId}"
                                    th:text="${requestDestination.name}"></td>
                                <td th:text="${#temporals.format(request.date, 'dd.MM.yyyy')}"/>
                                <td th:text="${#temporals.format(request.dateFrom, 'dd.MM.yyyy')}"/>
                                <td th:text="${#temporals.format(request.dateTo, 'dd.MM.yyyy')}"/>
                                <td>
                                    <a class="btn btn-outline-primary btn-sm"
                                       th:href="@{/debtors/{debtorId}/requests/{requestId}(debtorId=${debtor.id},requestId=${request.id})}"
                                       th:title="#{edit}"
                                       th:aria-label="#{edit-request}">
                                        <i class="fas fa-pen"></i></a>
                                </td>
                            </tr>
                            </tbody>
                        </table>

                    </fieldset>
                </div>
                <div class="tab-pane fade"
                     id="pills-creditors"
                     role="tabpanel"
                     aria-labelledby="pills-creditors-tab">
                    <div class="text-start">
                        <a th:href="@{/debtors/{debtorId}/creditors/new(debtorId=${debtor.getId()})}"
                           th:title="#{debtor.creditor.creation}"
                           class="btn btn-outline-success btn-sm">
                            <i class="fas fa-plus"></i>
                        </a>
                    </div>
                    <fieldset class="border p-2">
                        <legend class="float-none w-auto p-2" th:text="#{debtor.creditors}"></legend>

                        <table class="table">
                            <thead class="table-light">
                            <tr>
                                <th scope="col" th:text="#{debtor.creditor.id}"></th>
                                <th scope="col" th:text="#{debtor.creditor.name}"></th>
                                <th scope="col" th:text="#{debtor.creditor.clientType}"></th>
                                <th scope="col" th:text="#{action}"></th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="creditor : ${creditors}">
                                <td th:text="${creditor.id}"/>
                                <td th:text="${creditor.name}"/>
                                <td
                                    th:each="clientType : ${clientTypes}"
                                    th:if="${clientType.getCode() == creditor.clientType}"
                                    th:text="${clientType.getValue()}"/>
                                <td>
                                    <div class="btn-group flex-nowrap" role="group">
                                        <a class="btn btn-outline-primary btn-sm"
                                           th:href="@{/debtors/{debtorId}/creditors/{creditorId}(debtorId=${debtor.id},creditorId=${creditor.id})}"
                                           th:title="#{edit}"
                                           th:aria-label="#{edit-creditor}">
                                            <i class="fas fa-pen"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>

                    </fieldset>
                </div>
                <div class="tab-pane fade"
                     id="pills-publications"
                     role="tabpanel"
                     aria-labelledby="pills-publications-tab">
                    <div class="text-start">
                        <a th:href="@{/debtors/{debtorId}/publications/new(debtorId=${debtor.id})}"
                           th:title="#{debtor.publication.creation}"
                           class="btn btn-outline-success btn-sm">
                            <i class="fas fa-plus"></i>
                        </a>
                    </div>
                    <fieldset class="border p-2">
                        <legend class="float-none w-auto p-2" th:text="#{debtor.publications}"></legend>

                        <table class="table">
                            <thead class="table-light">
                            <tr>
                                <th scope="col" th:text="#{debtor.publication.id}"></th>
                                <th scope="col" th:text="#{debtor.publication.publicationDate}"></th>
                                <th scope="col" th:text="#{debtor.publication.appointmentDate}"></th>
                                <th scope="col" th:text="#{action}"></th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="publication : ${publications}">
                                <td th:text="${publication.id}"/>
                                <td th:text="${#temporals.format(publication.publicationDate, 'dd.MM.yyyy')}"/>
                                <td th:text="${#temporals.format(publication.appointmentDate, 'dd.MM.yyyy')}"/>
                                <td>
                                    <div class="btn-group flex-nowrap" role="group">
                                        <a class="btn btn-outline-primary btn-sm"
                                           th:href="@{/debtors/{debtorId}/publications/{publicationId}(debtorId=${debtor.id},publicationId=${publication.id})}"
                                           th:title="#{edit}"
                                           th:aria-label="#{edit-publication}">
                                            <i class="fas fa-pen"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>

                    </fieldset>
                </div>
                <div class="tab-pane fade"
                     id="pills-debtor-meeting"
                     role="tabpanel"
                     aria-labelledby="pills-debtor-meeting-tab">
                    <div th:if="${debtorMeetings?.size() <= 0}">
                        <div class="text-start">
                            <a th:href="@{/debtors/{debtorId}/debtor-meetings/new(debtorId=${debtor.id})}"
                               th:title="#{debtor.debtor-meeting.creation}"
                               class="btn btn-outline-success btn-sm">
                                <i class="fas fa-plus"></i>
                            </a>
                        </div>
                    </div>
                    <fieldset class="border p-2">
                        <legend class="float-none w-auto p-2" th:text="#{debtor.debtor-meeting}"></legend>

                        <table class="table">
                            <thead class="table-light">
                            <tr>
                                <th scope="col" th:text="#{debtor.debtor-meeting.id}"></th>
                                <th scope="col" th:text="#{debtor.debtor-meeting.date}"></th>
                                <th scope="col" th:text="#{debtor.debtor-meeting.time}"></th>
                                <th scope="col" th:text="#{action}"></th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="debtorMeeting : ${debtorMeetings}">
                                <td th:text="${debtorMeeting.id}"/>
                                <td th:text="${#temporals.format(debtorMeeting.date, 'dd.MM.yyyy')}"/>
                                <td th:text="${#temporals.format(debtorMeeting.time, 'hh:mm ')}"/>
                                <td>
                                    <div class="btn-group flex-nowrap" role="group">
                                        <a class="btn btn-outline-primary btn-sm"
                                           th:href="@{/debtors/{debtorId}/debtor-meetings/{debtorMeetingId}(debtorId=${debtor.id},debtorMeetingId=${debtorMeeting.id})}"
                                           th:title="#{edit}"
                                           th:aria-label="#{debtor.edit-debtor-meeting}">
                                            <i class="fas fa-pen"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>

                    </fieldset>
                </div>
                <div class="tab-pane fade"
                     id="pills-worker-meetings"
                     role="tabpanel"
                     aria-labelledby="pills-worker-meetings-tab">
                    <div th:if="${workerMeetings?.size() <= 0}">
                        <div class="text-start">
                            <a th:href="@{/debtors/{debtorId}/worker-meetings/new(debtorId=${debtor.id})}"
                               th:title="#{debtor.worker-meeting.creation}"
                               class="btn btn-outline-success btn-sm">
                                <i class="fas fa-plus"></i>
                            </a>
                        </div>
                    </div>
                    <fieldset class="border p-2">
                        <legend class="float-none w-auto p-2" th:text="#{debtor.worker-meeting}"></legend>
                        <table class="table">
                            <thead class="table-light">
                            <tr>
                                <th scope="col" th:text="#{debtor.worker-meeting.id}"></th>
                                <th scope="col" th:text="#{debtor.worker-meeting.date}"></th>
                                <th scope="col" th:text="#{debtor.worker-meeting.time}"></th>
                                <th scope="col" th:text="#{action}"></th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="workerMeeting : ${workerMeetings}">
                                <td th:text="${workerMeeting.id}"/>
                                <td th:text="${#temporals.format(workerMeeting.date, 'dd.MM.yyyy')}"/>
                                <td th:text="${#temporals.format(workerMeeting.time, 'hh:mm ')}"/>
                                <td>
                                    <div class="btn-group flex-nowrap" role="group">
                                        <a class="btn btn-outline-primary btn-sm"
                                           th:href="@{/debtors/{debtorId}/worker-meetings/{workerMeetingId}(debtorId=${debtor.id},workerMeetingId=${workerMeeting.id})}"
                                           th:title="#{edit}"
                                           th:aria-label="#{debtor.edit-worker-meeting}">
                                            <i class="fas fa-pen"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </fieldset>
                </div>

                <div class="tab-pane fade"
                     id="pills-documents"
                     role="tabpanel"
                     aria-labelledby="pills-documents-tab">
                    <div class="text-start">
                        <a class="btn btn-outline-success btn-sm"
                           th:href="@{/debtor/{debtorId}/document/generate(debtorId=${debtor.getId()})}"
                           th:title="#{debtor.generate-documents}"
                           th:aria-label="#{debtor.generate-documents}">
                            <i class="fas fa-repeat"></i>
                        </a>
                    </div>
                    <fieldset class="p-2">
                        <legend class="float-none w-auto p-2" th:text="#{debtor.documents}"></legend>
                        <div th:if="${documentGroups.isEmpty()}"
                             class="text-center text-muted py-4"
                             th:text="#{not-found-records}"></div>
                        <div th:unless="${documentGroups.isEmpty()}"
                             class="accordion accordion-flush"
                             id="documentsAccordion">
                            <div class="accordion-item" th:each="documentGroup, groupStat : ${documentGroups}">
                                <h2 class="accordion-header" th:id="'documents-heading-' + ${groupStat.index}">
                                    <button type="button"
                                            class="accordion-button collapsed"
                                            data-bs-toggle="collapse"
                                            th:data-bs-target="'#documents-collapse-' + ${groupStat.index}"
                                            aria-expanded="false"
                                            th:aria-controls="'documents-collapse-' + ${groupStat.index}">
                                        <span th:text="${documentGroup.name}"></span>
                                        <span class="badge text-bg-secondary ms-2"
                                              th:text="${documentGroup.documents.size}"></span>
                                    </button>
                                </h2>
                                <div class="accordion-collapse collapse"
                                     th:id="'documents-collapse-' + ${groupStat.index}"
                                     th:aria-labelledby="'documents-heading-' + ${groupStat.index}"
                                     data-bs-parent="#documentsAccordion">
                                    <div class="accordion-body p-0">
                                        <table class="table mb-0">
                                            <thead class="table-light">
                                            <tr>
                                                <th scope="col" th:text="#{debtor.document.name}"></th>
                                                <th scope="col" th:text="#{action}"></th>
                                            </tr>
                                            </thead>
                                            <tbody>
                                            <tr th:each="document : ${documentGroup.documents}">
                                                <td th:text="${document.name}"></td>
                                                <td>
                                                    <div class="btn-group flex-nowrap" role="group">
                                                        <a class="btn btn-outline-primary btn-sm"
                                                           th:href="@{/debtor/{debtorId}/document/{documentId}/download(debtorId=${debtor.id},documentId=${document.id})}"
                                                           th:title="#{debtor.download-document}"
                                                           th:aria-label="#{debtor.download-document}">
                                                            <i class="fas fa-file-arrow-down"></i>
                                                        </a>
                                                        <a class="btn btn-outline-danger btn-sm"
                                                           th:href="@{/debtor/{debtorId}/document/{documentId}/delete(debtorId=${debtor.id},documentId=${document.id})}"
                                                           th:deleteMessage="#{do-you-want-delete-record(${document.name})}"
                                                           th:title="#{debtor.delete-document}"
                                                           th:aria-label="#{debtor.delete-document}">
                                                            <i class="fas fa-trash"></i>
                                                        </a>
                                                    </div>
                                                </td>
                                            </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </fieldset>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/delete-modal :: deleteModal(${isEdit}, '/debtors/' + ${debtor.id}, #{debtor.delete-title}, #{debtor.delete-confirm})}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>

<script type="text/javascript">
    $(document).ready(function () {
        $(".btnDelete").on("click", function (e) {
            e.preventDefault();
            link = $(this);
            deleteMessage = link.attr("deleteMessage")
            $("#yesBtn").attr("href", link.attr("href"));
            $("#confirmText").html(deleteMessage);
            bootstrap.Modal.getOrCreateInstance(document.getElementById("confirmModal")).show();
        });

        $("#btnArbitrationCaseCopy").on("click", function () {
            const arbitrationCase = document.getElementById("arbitrationCase");
            arbitrationCase.select();
            navigator.clipboard.writeText(arbitrationCase.value);
        });

        $("#btnArbitrationCaseOpen").on("click", function () {
            const arbitrationCase = document.getElementById("arbitrationCase");
            window.open(arbitrationCase.value).focus()
        });
    });
    
</script>

</body>

</html>
