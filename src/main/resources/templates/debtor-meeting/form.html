<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/head :: head}"></div>

<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container flex-grow-1 py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0"
            th:text="${isEdit} ? #{update-debtor-meeting} : #{debtor.debtor-meeting.creation}">Debtor meeting</h1>
    </div>

    <div th:replace="~{fragments/success-operation-message :: infoMessage(${infoMessage})}"></div>
    <div th:replace="~{fragments/error-operation-message :: errorMessage(${error})}"></div>

    <form th:method="post" th:object="${debtorMeeting}"
          th:action="@{/debtors/{debtorId}/debtor-meetings(debtorId=${debtor.id})}">
        <input type="hidden" th:field="*{id}"/>
        <input type="hidden" th:field="*{debtorId}"/>

        <div class="row">
            <div class="mb-3 col-md-6">
                <label class="col-form-label" for="date" th:text="#{debtor.debtor-meeting.date}"></label>
                <input type="date" th:field="*{date}" class="form-control" id="date"/>
            </div>
            <div class="mb-3 col-md-6">
                <label class="col-form-label" for="time" th:text="#{debtor.debtor-meeting.time}"></label>
                <input type="time" th:field="*{time}" class="form-control" id="time"/>
            </div>
        </div>
        <div class="row">
            <div class="mb-3 col-md-6">
                <label class="col-form-label" for="registrationTimeFrom"
                       th:text="#{debtor.debtor-meeting.registrationTimeFrom}"></label>
                <input type="time" th:field="*{registrationTimeFrom}" class="form-control"
                       id="registrationTimeFrom"/>
            </div>
            <div class="mb-3 col-md-6">
                <label class="col-form-label" for="registrationTimeTo"
                       th:text="#{debtor.debtor-meeting.registrationTimeTo}"></label>
                <input type="time" th:field="*{registrationTimeTo}" class="form-control"
                       id="registrationTimeTo"/>
            </div>
        </div>
        <div class="row">
            <div class="mb-3 col-12">
                <label class="col-form-label" for="address" th:text="#{debtor.debtor-meeting.address}"></label>
                <textarea rows="3" th:field="*{address}" class="form-control" id="address"></textarea>
            </div>
        </div>
        <div class="row">
            <div class="mb-3 col-md-6">
                <label class="col-form-label" for="familiarizationDateFrom"
                       th:text="#{debtor.debtor-meeting.familiarizationDateFrom}"></label>
                <input type="date" th:field="*{familiarizationDateFrom}" class="form-control"
                       id="familiarizationDateFrom"/>
            </div>
            <div class="mb-3 col-md-6">
                <label class="col-form-label" for="familiarizationDateTo"
                       th:text="#{debtor.debtor-meeting.familiarizationDateTo}"></label>
                <input type="date" th:field="*{familiarizationDateTo}" class="form-control"
                       id="familiarizationDateTo"/>
            </div>
        </div>

        <div class="col-12 d-flex justify-content-center gap-2">
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/debtors/{id}(id=${debtor.id})}"
               th:title="#{debtor}" th:aria-label="#{debtor}"><i class="fas fa-list"></i></a>
            <button type="submit" class="btn btn-outline-success btn-sm" th:title="#{save}"
                    th:aria-label="#{save}"><i class="fas fa-save"></i></button>
            <button th:if="${isEdit}" type="button" class="btn btn-outline-danger btn-sm"
                    data-bs-toggle="modal" data-bs-target="#delete-modal" th:title="#{delete}"
                    th:aria-label="#{delete}"><i class="fas fa-trash"></i></button>
        </div>
    </form>

    <div th:if="${isEdit}" class="mt-4">
        <ul class="nav nav-pills mb-3" id="pills-tab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="pills-debtor-meeting-questions-tab" data-bs-toggle="pill"
                        data-bs-target="#pills-debtor-meeting-questions" type="button" role="tab"
                        aria-controls="pills-debtor-meeting-questions" aria-selected="true"
                        th:text="#{debtor.debtor-meeting.debtor-meeting-questions}"></button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="pills-debtor-meeting-participants-tab" data-bs-toggle="pill"
                        data-bs-target="#pills-debtor-meeting-participants" type="button" role="tab"
                        aria-controls="pills-debtor-meeting-participants" aria-selected="false"
                        th:text="#{debtor.debtor-meeting.debtor-meeting-participants}"></button>
            </li>
        </ul>

        <div class="tab-content" id="pills-tabContent">
            <div class="tab-pane fade show active" id="pills-debtor-meeting-questions" role="tabpanel"
                 aria-labelledby="pills-debtor-meeting-questions-tab">
                <div class="text-start">
                    <a class="btn btn-outline-success btn-sm"
                       th:href="@{/debtors/{debtorId}/debtor-meetings/{debtorMeetingId}/questions/new(debtorId=${debtor.id},debtorMeetingId=${debtorMeeting.id})}"
                       th:title="#{debtor.debtor-meeting.debtor-meeting-question.creation}">
                        <i class="fas fa-plus"></i>
                    </a>
                </div>
                <fieldset class="border p-2">
                    <legend class="float-none w-auto p-2"
                            th:text="#{debtor.debtor-meeting.debtor-meeting-questions}"></legend>
                    <table class="table">
                        <thead class="table-light">
                        <tr>
                            <th scope="col" th:text="#{debtor.debtor-meeting.debtor-meeting-question.id}"></th>
                            <th scope="col" th:text="#{debtor.debtor-meeting.debtor-meeting-question.position}"></th>
                            <th scope="col" th:text="#{debtor.debtor-meeting.debtor-meeting-question.question}"></th>
                            <th scope="col" th:text="#{action}"></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="debtorMeetingQuestion : ${debtorMeetingQuestions}">
                            <td th:text="${debtorMeetingQuestion.id}"></td>
                            <td th:text="${debtorMeetingQuestion.position}"></td>
                            <td th:text="${debtorMeetingQuestion.question}"></td>
                            <td>
                                <div class="btn-group flex-nowrap" role="group">
                                    <a class="btn btn-outline-primary btn-sm"
                                       th:href="@{/debtors/{debtorId}/debtor-meetings/{debtorMeetingId}/questions/{debtorMeetingQuestionId}(debtorId=${debtor.id},debtorMeetingId=${debtorMeeting.id},debtorMeetingQuestionId=${debtorMeetingQuestion.id})}"
                                       th:title="#{edit}" th:aria-label="#{debtor.edit-debtor-meeting-question}">
                                        <i class="fas fa-pen"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </fieldset>
            </div>

            <div class="tab-pane fade" id="pills-debtor-meeting-participants" role="tabpanel"
                 aria-labelledby="pills-debtor-meeting-participants-tab">
                <div class="text-start">
                    <a class="btn btn-outline-success btn-sm"
                       th:href="@{/debtors/{debtorId}/debtor-meetings/{debtorMeetingId}/participants/new(debtorId=${debtor.id},debtorMeetingId=${debtorMeeting.id})}"
                       th:title="#{debtor.debtor-meeting.debtor-meeting-participant.creation}">
                        <i class="fas fa-plus"></i>
                    </a>
                </div>
                <fieldset class="border p-2">
                    <legend class="float-none w-auto p-2"
                            th:text="#{debtor.debtor-meeting.debtor-meeting-participants}"></legend>
                    <table class="table">
                        <thead class="table-light">
                        <tr>
                            <th scope="col" th:text="#{debtor.debtor-meeting.debtor-meeting-participant.id}"></th>
                            <th scope="col" th:text="#{debtor.debtor-meeting.debtor-meeting-participant.type}"></th>
                            <th scope="col" th:text="#{debtor.debtor-meeting.debtor-meeting-participant.withoutRight}"></th>
                            <th scope="col" th:text="#{action}"></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="debtorMeetingParticipant : ${debtorMeetingParticipants}">
                            <td th:text="${debtorMeetingParticipant.id}"></td>
                            <td th:each="type : ${meetingParticipantTypes}"
                                th:if="${type.code == debtorMeetingParticipant.type}"
                                th:text="${type.value}"></td>
                            <td th:text="${debtorMeetingParticipant.withoutRight} ? #{yes} : #{no}"></td>
                            <td>
                                <div class="btn-group flex-nowrap" role="group">
                                    <a class="btn btn-outline-primary btn-sm"
                                       th:href="@{/debtors/{debtorId}/debtor-meetings/{debtorMeetingId}/participants/{debtorMeetingParticipantId}(debtorId=${debtor.id},debtorMeetingId=${debtorMeeting.id},debtorMeetingParticipantId=${debtorMeetingParticipant.id})}"
                                       th:title="#{edit}" th:aria-label="#{debtor.edit-debtor-meeting-participant}">
                                        <i class="fas fa-pen"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </fieldset>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/delete-modal :: deleteModal(${isEdit}, '/debtors/' + ${debtor.id} + '/debtor-meetings/' + ${debtorMeeting.id}, #{debtor-meeting.delete-title}, #{debtor-meeting.delete-confirm})}"></div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
