<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0" />
  <title>Newsletters</title>

  <link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" />
  <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}" />
  <script type="text/javascript" th:src="@{/webjars/jquery/jquery.min.js}"></script>
  <script type="text/javascript" th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
</head>

<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="container-fluid">
  <h2 class="text-center">[[${pageTitle}]]</h2>

  <div class="my-3">
    <form th:action="@{/debtor/{debtorId}/publication/save(debtorId=${debtor.id})}" method="post" enctype="multipart/form-data" th:object="${publication}">
      <div class="p-3">
        <input type="hidden" th:field="*{id}"/>
        <input type="hidden" name="debtorId" th:value="${debtor.id}" id="debtorId"/>
        <div class="form-row">
          <div class="form-group col-md-6">
            <a th:href="@{/debtor/{debtorId}(debtorId=${debtor.getId()})}"
               th:title="#{debtor.publication.creation}"
               th:text="${debtor.name}"
               id="debtorName">
            </a>
          </div>
          <div class="form-group col-md-6">
          </div>
        </div>
        <div class="form-row">
            <div class="form-group col-md-6">
              <label class="col-form-label" for="publicationDate" th:text="#{debtor.publication.publicationDate}"/>
              <input type="date" name="publicationDate" th:value="${publication.publicationDate}" class="form-control" id="publicationDate"/>
          </div>
          <div class="form-group col-md-6">
            <label class="col-form-label" for="hallNumber" th:text="#{debtor.publication.hallNumber}"/>
            <input type="number" name="hallNumber" th:value="${publication.hallNumber}" class="form-control" id="hallNumber"/>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group col-md-6">
            <label class="col-form-label" for="appointmentDate" th:text="#{debtor.publication.appointmentDate}"/>
            <input type="date" name="appointmentDate" th:value="${publication.appointmentDate}" class="form-control" id="appointmentDate"/>
          </div>
          <div class="form-group col-md-6">
            <label class="col-form-label" for="appointmentTime" th:text="#{debtor.publication.appointmentTime}"/>
            <input type="time" name="appointmentTime" th:value="${publication.appointmentTime}" class="form-control" id="appointmentTime"/>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group col-md-6">
            <label class="col-form-label" for="kommersantMessageNumber" th:text="#{debtor.publication.kommersantMessageNumber}"/>
            <input type="text" name="kommersantMessageNumber" th:value="${publication.kommersantMessageNumber}" class="form-control" id="kommersantMessageNumber"/>
          </div>
          <div class="form-group col-md-6">
            <label class="col-form-label" for="efrsbMessageNumber" th:text="#{debtor.publication.efrsbMessageNumber}"/>
            <input type="text" name="efrsbMessageNumber" th:value="${publication.efrsbMessageNumber}" class="form-control" id="efrsbMessageNumber"/>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group col-md-12">
            <label class="col-form-label" for="address" th:text="#{addition-information}"/>
            <textarea rows="5" cols="100" th:field="*{additionInformation}" class="form-control" id="address"></textarea>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group col-md-6">
            <label class="col-form-label" for="kommersantIssueNumber" th:text="#{debtor.publication.kommersantIssueNumber}"/>
              <input type="text" name="kommersantIssueNumber" th:value="${publication.kommersantIssueNumber}" class="form-control" id="kommersantIssueNumber"/>
          </div>
        </div>

        <div class="text-center">
          <input type="submit" th:value="#{save}" class="btn btn-primary btn-sm mr-2" />
          <input type="button" th:value="#{cancel}" id="btnCancel" class="btn btn-secondary btn-sm" />
        </div>
      </div>
    </form>
  </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script type="text/javascript">
  $(document).ready(function () {
    $("#btnCancel").on("click", function () {
      window.location = "[[@{/debtor/{debtorId}(debtorId=${debtor.id})}]]";
    });
  });
</script>

</body>

</html>
