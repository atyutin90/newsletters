<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/head :: head}"></div>

<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container flex-grow-1 py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0" th:text="${isEdit} ? #{update-question} : #{create-question}">Question</h1>
    </div>

    <div th:replace="~{fragments/success-operation-message :: infoMessage(${infoMessage})}"></div>
    <div th:replace="~{fragments/error-operation-message :: errorMessage(${error})}"></div>

    <form th:method="post" th:object="${data}" th:action="@{/questions}">
        <input type="hidden" th:field="*{id}"/>
        <div class="row">
            <div class="mb-3 col-md-12">
                <label class="col-form-label" for="position" th:text="#{question.position}"></label>
                <input type="number" required th:field="*{position}" class="form-control" id="position"/>
            </div>
        </div>
        <div class="row">
            <div class="mb-3 col-md-12">
                <label class="col-form-label" for="value" th:text="#{question.value}"></label>
                <textarea rows="5" th:field="*{value}" class="form-control" id="value"></textarea>
            </div>
        </div>
        <div class="row">
            <div class="mb-3 col-md-12">
                <label class="col-form-label" for="documentTemplateIds" th:text="#{question.document-template}"></label>
                <select size="10" class="form-select" id="documentTemplateIds" multiple
                        th:field="*{documentTemplateIds}">
                    <option th:each="documentTemplate : ${documentTemplates}"
                            th:value="${documentTemplate.id}"
                            th:text="${documentTemplate.name}"></option>
                </select>
            </div>
        </div>

        <div class="col-12 d-flex justify-content-center gap-2">
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/questions}" th:title="#{list}"
               th:aria-label="#{list}">
                <i class="fas fa-list"></i>
            </a>
            <button type="submit" class="btn btn-outline-success btn-sm" th:title="#{save}"
                    th:aria-label="#{save}">
                <i class="fas fa-save"></i>
            </button>
            <button th:if="${isEdit}" type="button" class="btn btn-outline-danger btn-sm"
                    data-bs-toggle="modal" data-bs-target="#delete-modal" th:title="#{delete}"
                    th:aria-label="#{delete}">
                <i class="fas fa-trash"></i>
            </button>
        </div>
    </form>
</main>

<div th:replace="~{fragments/delete-modal :: deleteModal(${isEdit}, '/questions/' + ${data.id}, #{question.delete-title}, #{question.delete-confirm})}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
