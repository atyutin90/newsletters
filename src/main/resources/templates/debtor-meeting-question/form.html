<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/head :: head}"></div>

<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container flex-grow-1 py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0"
            th:text="${isEdit} ? #{debtor.debtor-meeting.debtor-meeting-question.update} : #{debtor.debtor-meeting.debtor-meeting-question.creation}">Question</h1>
    </div>

    <div th:replace="~{fragments/success-operation-message :: infoMessage(${infoMessage})}"></div>
    <div th:replace="~{fragments/error-operation-message :: errorMessage(${error})}"></div>

    <form th:method="post" th:object="${debtorMeetingQuestion}"
          th:action="@{/debtors/{debtorId}/debtor-meetings/{debtorMeetingId}/questions(debtorId=${debtorMeeting.debtorId},debtorMeetingId=${debtorMeeting.id})}">
        <input type="hidden" th:field="*{id}"/>
        <input type="hidden" th:field="*{debtorMeetingId}"/>

        <div class="row">
            <div class="mb-3 col-md-6">
                <label class="col-form-label" for="position"
                       th:text="#{debtor.debtor-meeting.debtor-meeting-question.position}"></label>
                <input type="number" required th:field="*{position}" class="form-control" id="position"/>
            </div>
            <div class="mb-3 col-md-6"></div>
        </div>
        <div class="row">
            <div class="mb-3 col-12">
                <label class="col-form-label" for="question"
                       th:text="#{debtor.debtor-meeting.debtor-meeting-question.question}"></label>
                <textarea rows="5" th:field="*{question}" class="form-control" id="question"></textarea>
            </div>
        </div>
        <div class="row">
            <div class="mb-3 col-12">
                <label class="col-form-label" for="proposedSolution"
                       th:text="#{debtor.debtor-meeting.debtor-meeting-question.proposedSolution}"></label>
                <textarea rows="5" th:field="*{proposedSolution}" class="form-control"
                          id="proposedSolution"></textarea>
            </div>
        </div>
        <div class="row">
            <div class="mb-3 col-12">
                <label class="col-form-label" for="acceptedSolution"
                       th:text="#{debtor.debtor-meeting.debtor-meeting-question.acceptedSolution}"></label>
                <textarea rows="5" th:field="*{acceptedSolution}" class="form-control"
                          id="acceptedSolution"></textarea>
            </div>
        </div>

        <div class="col-12 d-flex justify-content-center gap-2">
            <a class="btn btn-outline-secondary btn-sm"
               th:href="@{/debtors/{debtorId}/debtor-meetings/{debtorMeetingId}(debtorId=${debtorMeeting.debtorId},debtorMeetingId=${debtorMeeting.id})}"
               th:title="#{debtor.debtor-meeting}" th:aria-label="#{debtor.debtor-meeting}">
                <i class="fas fa-list"></i>
            </a>
            <button type="submit" class="btn btn-outline-success btn-sm" th:title="#{save}"
                    th:aria-label="#{save}"><i class="fas fa-save"></i></button>
            <button th:if="${isEdit}" type="button" class="btn btn-outline-danger btn-sm"
                    data-bs-toggle="modal" data-bs-target="#delete-modal" th:title="#{delete}"
                    th:aria-label="#{delete}"><i class="fas fa-trash"></i></button>
        </div>
    </form>
</main>

<div th:replace="~{fragments/delete-modal :: deleteModal(${isEdit}, '/debtors/' + ${debtorMeeting.debtorId} + '/debtor-meetings/' + ${debtorMeeting.id} + '/questions/' + ${debtorMeetingQuestion.id}, #{debtor-meeting-question.delete-title}, #{debtor-meeting-question.delete-confirm})}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
