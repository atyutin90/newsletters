<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/head :: head}"></div>

<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container flex-grow-1 py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0"
            th:text="${isEdit} ? #{debtor.worker-meeting.update} : #{debtor.worker-meeting.creation}">Worker meeting</h1>
    </div>

    <div th:replace="~{fragments/success-operation-message :: infoMessage(${infoMessage})}"></div>
    <div th:replace="~{fragments/error-operation-message :: errorMessage(${error})}"></div>

    <form th:method="post" th:object="${workerMeeting}"
          th:action="@{/debtors/{debtorId}/worker-meetings(debtorId=${debtor.id})}">
        <input type="hidden" th:field="*{id}"/>
        <input type="hidden" th:field="*{debtorId}"/>

        <div class="row">
            <div class="mb-3 col-md-6">
                <label class="col-form-label" for="date" th:text="#{debtor.worker-meeting.date}"></label>
                <input type="date" th:field="*{date}" class="form-control" id="date"/>
            </div>
            <div class="mb-3 col-md-6">
                <label class="col-form-label" for="time" th:text="#{debtor.worker-meeting.time}"></label>
                <input type="time" th:field="*{time}" class="form-control" id="time"/>
            </div>
        </div>
        <div class="row">
            <div class="mb-3 col-md-6">
                <label class="col-form-label" for="registrationTimeFrom"
                       th:text="#{debtor.worker-meeting.registrationTimeFrom}"></label>
                <input type="time" th:field="*{registrationTimeFrom}" class="form-control"
                       id="registrationTimeFrom"/>
            </div>
            <div class="mb-3 col-md-6">
                <label class="col-form-label" for="registrationTimeTo"
                       th:text="#{debtor.worker-meeting.registrationTimeTo}"></label>
                <input type="time" th:field="*{registrationTimeTo}" class="form-control"
                       id="registrationTimeTo"/>
            </div>
        </div>
        <div class="row">
            <div class="mb-3 col-12">
                <label class="col-form-label" for="address" th:text="#{debtor.worker-meeting.address}"></label>
                <textarea rows="3" th:field="*{address}" class="form-control" id="address"></textarea>
            </div>
        </div>
        <div class="row">
            <div class="mb-3 col-12">
                <label class="col-form-label" for="topic" th:text="#{debtor.worker-meeting.topic}"></label>
                <textarea rows="3" th:field="*{topic}" class="form-control" id="topic"></textarea>
            </div>
        </div>

        <div class="col-12 d-flex justify-content-center gap-2">
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/debtors/{id}(id=${debtor.id})}"
               th:title="#{debtor}" th:aria-label="#{debtor}"><i class="fas fa-list"></i></a>
            <button type="submit" class="btn btn-outline-success btn-sm" th:title="#{save}"
                    th:aria-label="#{save}"><i class="fas fa-save"></i></button>
            <button th:if="${isEdit}" type="button" class="btn btn-outline-danger btn-sm"
                    data-bs-toggle="modal" data-bs-target="#delete-modal" th:title="#{delete}"
                    th:aria-label="#{delete}"><i class="fas fa-trash"></i></button>
        </div>
    </form>

    <div th:if="${isEdit}" class="mt-4">
        <div class="text-start">
            <a class="btn btn-outline-success btn-sm"
               th:href="@{/debtors/{debtorId}/worker-meetings/{workerMeetingId}/participants/new(debtorId=${debtor.id},workerMeetingId=${workerMeeting.id})}"
               th:title="#{debtor.worker-meeting.worker-meeting-participant.creation}">
                <i class="fas fa-plus"></i>
            </a>
        </div>
        <fieldset class="border p-2">
            <legend class="float-none w-auto p-2"
                    th:text="#{debtor.worker-meeting.worker-meeting-participants}"></legend>
            <table class="table">
                <thead class="table-light">
                <tr>
                    <th scope="col" th:text="#{debtor.worker-meeting.worker-meeting-participant.id}"></th>
                    <th scope="col" th:text="#{debtor.worker-meeting.worker-meeting-participant.fullName}"></th>
                    <th scope="col" th:text="#{action}"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="workerMeetingParticipant : ${workerMeetingParticipants}">
                    <td th:text="${workerMeetingParticipant.id}"></td>
                    <td th:text="${workerMeetingParticipant.fullName}"></td>
                    <td>
                        <div class="btn-group flex-nowrap" role="group">
                            <a class="btn btn-outline-primary btn-sm"
                               th:href="@{/debtors/{debtorId}/worker-meetings/{workerMeetingId}/participants/{workerMeetingParticipantId}(debtorId=${debtor.id},workerMeetingId=${workerMeeting.id},workerMeetingParticipantId=${workerMeetingParticipant.id})}"
                               th:title="#{edit}" th:aria-label="#{debtor.edit-worker-meeting-participant}">
                                <i class="fas fa-pen"></i>
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </fieldset>
    </div>
</main>

<div th:replace="~{fragments/delete-modal :: deleteModal(${isEdit}, '/debtors/' + ${debtor.id} + '/worker-meetings/' + ${workerMeeting.id}, #{worker-meeting.delete-title}, #{worker-meeting.delete-confirm})}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
