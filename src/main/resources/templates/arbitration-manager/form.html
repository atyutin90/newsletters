<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/head :: head}"></div>

<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container flex-grow-1 py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0" th:text="${isEdit} ? #{update-arbitration-manager} : #{create-arbitration-manager}">
            Employee</h1>
    </div>

    <div th:replace="~{fragments/success-operation-message :: infoMessage(${infoMessage})}"></div>
    <div th:replace="~{fragments/error-operation-message :: errorMessage(${error})}"></div>

    <form class="row g-3"
          th:method="post"
          th:object="${data}"
          th:action="@{/arbitration-managers}">

        <input type="hidden" th:field="*{id}"/>
        <div class="col-12">
            <label class="col-form-label" for="fullName" th:text="#{arbitration-manager.full-name}"></label>
            <input type="text" th:field="*{fullName}" class="form-control" id="fullName"/>
        </div>
        <div class="col-md-6">
            <label class="col-form-label" for="taxpayerIdentificationNumber"
                   th:text="#{arbitration-manager.taxpayer-identification-number}"></label>
            <input type="text" th:field="*{taxpayerIdentificationNumber}"
                   class="form-control" id="taxpayerIdentificationNumber"/>
        </div>
        <div class="col-md-6">
            <label class="col-form-label" for="personalInsurancePolicyNumber"
                   th:text="#{arbitration-manager.personal-insurance-policy-number}"></label>
            <input type="text" th:field="*{personalInsurancePolicyNumber}"
                   class="form-control" id="personalInsurancePolicyNumber"/>
        </div>
        <div class="col-12">
            <label class="col-form-label" for="postalAddress" th:text="#{arbitration-manager.mailing-address}"></label>
            <input type="text" th:field="*{postalAddress}" class="form-control" id="postalAddress"/>
        </div>
        <div class="col-12">
            <label class="col-form-label" for="actualPostalAddress"
                   th:text="#{arbitration-manager.actual-postal-address}"></label>
            <input type="text" th:field="*{actualPostalAddress}" class="form-control" id="actualPostalAddress"/>
        </div>
        <div class="col-md-6">
            <label class="col-form-label" for="email" th:text="#{arbitration-manager.email}"></label>
            <input type="text" th:field="*{email}" class="form-control" id="email"/>
        </div>
        <div class="col-md-6">
            <label class="col-form-label" for="phone" th:text="#{arbitration-manager.phone}"></label>
            <input type="text" th:field="*{phone}" class="form-control" id="phone"/>
        </div>
        <div class="col-md-6">
            <label class="col-form-label" for="sroData" th:text="#{arbitration-manager.sro-data}"></label>
            <input type="text" th:field="*{sroData}" class="form-control" id="sroData"/>
        </div>
        <div class="col-md-6">
            <label class="col-form-label" for="sroRegistrationNumber"
                   th:text="#{arbitration-manager.sro-registration-number}"></label>
            <input type="text" th:field="*{sroRegistrationNumber}"
                   class="form-control" id="sroRegistrationNumber"/>
        </div>
        <div class="col-md-6">
            <label class="col-form-label" for="insuranceCompanyName"
                   th:text="#{arbitration-manager.insurance-company-name}"></label>
            <input type="text" th:field="*{insuranceCompanyName}"
                   class="form-control" id="insuranceCompanyName"/>
        </div>
        <div class="col-md-6">
            <label class="col-form-label" for="insuranceContractNumber"
                   th:text="#{arbitration-manager.insurance-contract-number}"></label>
            <input type="text" th:field="*{insuranceContractNumber}"
                   class="form-control" id="insuranceContractNumber"/>
        </div>
        <div class="col-md-6">
            <label class="col-form-label" for="insuranceContractTerm"
                   th:text="#{arbitration-manager.insurance-contract-term}"></label>
            <input type="text" th:field="*{insuranceContractTerm}"
                   class="form-control" id="insuranceContractTerm"/>
        </div>

      <div class="col-12 d-flex justify-content-center gap-2">
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/arbitration-managers}" th:title="#{list}" th:aria-label="#{list}">
          <i class="fas fa-list"></i>
        </a>
        <button type="submit" class="btn btn-outline-success btn-sm" th:title="#{save}" th:aria-label="#{save}">
          <i class="fas fa-save"></i>
        </button>
        <button th:if="${isEdit}"
                type="button"
                class="btn btn-outline-danger btn-sm"
                data-bs-toggle="modal"
                data-bs-target="#delete-modal"
                th:title="#{delete}"
                th:aria-label="#{delete}">
          <i class="fas fa-trash"></i>
        </button>
      </div>
    </form>
    <div th:if="${debtors.size() > 0}" class="mt-4">
        <fieldset class="border p-2">
            <legend class="float-none w-auto p-2" th:text="#{debtors}"></legend>
            <table class="table">
                <thead class="table-light">
                <tr>
                    <th scope="col" th:text="#{id}"></th>
                    <th scope="col" th:text="#{debtor.full-name}"></th>
                    <th scope="col" th:text="#{action}"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="debtor : ${debtors}">
                    <td th:text="${debtor.id}"></td>
                    <td th:text="${debtor.fullName}"></td>
                    <td>
                        <a class="btn btn-outline-primary btn-sm"
                           th:href="@{/debtors/{debtorId}(debtorId=${debtor.id})}"
                           th:title="#{edit}"
                           th:aria-label="#{edit}">
                            <i class="fas fa-pen"></i>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </fieldset>
    </div>

</main>

<div th:replace="~{fragments/delete-modal :: deleteModal(${isEdit}, '/arbitration-managers/' + ${data.id}, #{arbitration-manager.delete-title}, #{arbitration-manager.delete-confirm})}"></div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
