<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/head :: head}"></div>

<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container flex-grow-1 py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0"
            th:text="${isEdit} ? #{update-request-destination} : #{request-destination.create}">Destination</h1>
    </div>

    <div th:replace="~{fragments/success-operation-message :: infoMessage(${infoMessage})}"></div>
    <div th:replace="~{fragments/error-operation-message :: errorMessage(${error})}"></div>

    <form th:method="post" th:object="${data}" th:action="@{/request-destinations}">
        <input type="hidden" th:field="*{id}"/>
        <div class="row">
            <div class="mb-3 col-md-12">
                <label class="col-form-label" for="name" th:text="#{request-destination.name}"></label>
                <input type="text" th:field="*{name}" class="form-control" id="name"/>
            </div>
            <div class="mb-3 col-md-12">
                <label class="col-form-label" for="documentTemplateId"
                       th:text="#{request-destination.document-template}"></label>
                <select class="form-select" id="documentTemplateId" th:field="*{documentTemplateId}">
                    <option th:if="${data.documentTemplateId == null}" selected th:value="${null}"
                            th:text="#{choose}"></option>
                    <option th:each="documentTemplate : ${documentTemplates}"
                            th:value="${documentTemplate.id}"
                            th:text="${documentTemplate.name}"></option>
                </select>
            </div>
        </div>
        <div class="mb-3 form-check">
            <input type="checkbox" th:field="*{enabled}" class="form-check-input" id="enabled"/>
            <label class="form-check-label" for="enabled" th:text="#{request-destination.enabled}"></label>
        </div>

        <div class="col-12 d-flex justify-content-center gap-2">
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/request-destinations}" th:title="#{list}"
               th:aria-label="#{list}"><i class="fas fa-list"></i></a>
            <button type="submit" class="btn btn-outline-success btn-sm" th:title="#{save}"
                    th:aria-label="#{save}"><i class="fas fa-save"></i></button>
            <button th:if="${isEdit}" type="button" class="btn btn-outline-danger btn-sm"
                    data-bs-toggle="modal" data-bs-target="#delete-modal" th:title="#{delete}"
                    th:aria-label="#{delete}"><i class="fas fa-trash"></i></button>
        </div>
    </form>
</main>

<div th:replace="~{fragments/delete-modal :: deleteModal(${isEdit}, '/request-destinations/' + ${data.id}, #{request-destination.delete-title}, #{request-destination.delete-confirm})}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
