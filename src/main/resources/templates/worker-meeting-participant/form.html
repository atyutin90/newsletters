<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0" />
    <title>Newsletters</title>

    <link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" />
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css"
          integrity="sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <script type="text/javascript" th:src="@{/webjars/jquery/jquery.min.js}"></script>
    <script type="text/javascript" th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
</head>

<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="container-fluid">
    <h2 class="text-center">[[${pageTitle}]]</h2>

    <div class="my-3">
        <form th:action="@{/debtor/{debtorId}/worker-meeting/{workerMeetingId}/worker-meeting-participant/save(debtorId=${workerMeeting.getDebtorId()}, workerMeetingId=${workerMeeting.getId()})}" method="post" enctype="multipart/form-data" th:object="${workerMeetingParticipant}">
            <input type="hidden" th:field="*{id}"/>
            <div class="p-3">
                <input type="hidden" name="debtorId" th:value="${workerMeeting.debtorId}" id="debtorId"/>
               <div class="form-row">
                    <div class="form-group col-md-6">
                        <a th:href="@{/debtor/{debtorId}/worker-meeting/{workerMeetingId}(debtorId=${workerMeeting.getDebtorId()},workerMeetingId=${workerMeeting.getId()})}"
                           th:title="#{debtor.worker-meeting}"
                           class="fa-solid fa-reply fa-2xl icon-dark"
                           id="debtorName">
                        </a>
                    </div>
                    <div class="form-group col-md-6">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-12">
                        <label class="col-form-label" for="fullName" th:text="#{debtor.worker-meeting.worker-meeting-participant.fullName}"/>
                        <input type="text" name="fullName" th:value="${workerMeetingParticipant.fullName}" class="form-control" id="fullName"/>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-12">
                        <label class="col-form-label" for="address" th:text="#{debtor.worker-meeting.worker-meeting-participant.address}"/>
                        <textarea rows="5" cols="100" th:field="*{address}" class="form-control" id="address"></textarea>
                    </div>
                </div>

                <div class="text-center">
                    <input type="submit" th:value="#{save}" class="btn btn-primary btn-sm mr-2" />
                    <input type="button" th:value="#{cancel}" id="btnCancel" class="btn btn-secondary btn-sm" />
                </div>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script type="text/javascript">
    $(document).ready(function () {
        $("#btnCancel").on("click", function () {
            window.location = "[[@{/debtor/{debtorId}/worker-meeting/{workerMeetingId}(debtorId=${workerMeeting.getDebtorId()},workerMeetingId=${workerMeeting.getId()})}]]";
        });
    });
</script>

</body>
</html>
