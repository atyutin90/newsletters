<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/head :: head}"></div>

<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container flex-grow-1 py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0"
            th:text="${isEdit} ? #{debtor.worker-meeting.worker-meeting-participant.update} : #{debtor.worker-meeting.worker-meeting-participant.creation}">Worker meeting participant</h1>
    </div>

    <div th:replace="~{fragments/success-operation-message :: infoMessage(${infoMessage})}"></div>
    <div th:replace="~{fragments/error-operation-message :: errorMessage(${error})}"></div>

    <form th:method="post" th:object="${workerMeetingParticipant}"
          th:action="@{/debtors/{debtorId}/worker-meetings/{workerMeetingId}/participants(debtorId=${workerMeeting.debtorId},workerMeetingId=${workerMeeting.id})}">
        <input type="hidden" th:field="*{id}"/>
        <input type="hidden" th:field="*{workerMeetingId}"/>

        <div class="row">
            <div class="mb-3 col-12">
                <label class="col-form-label" for="fullName"
                       th:text="#{debtor.worker-meeting.worker-meeting-participant.fullName}"></label>
                <input type="text" th:field="*{fullName}" class="form-control" id="fullName"/>
            </div>
        </div>
        <div class="row">
            <div class="mb-3 col-12">
                <label class="col-form-label" for="address"
                       th:text="#{debtor.worker-meeting.worker-meeting-participant.address}"></label>
                <textarea rows="5" th:field="*{address}" class="form-control" id="address"></textarea>
            </div>
        </div>

        <div class="col-12 d-flex justify-content-center gap-2">
            <a class="btn btn-outline-secondary btn-sm"
               th:href="@{/debtors/{debtorId}/worker-meetings/{workerMeetingId}(debtorId=${workerMeeting.debtorId},workerMeetingId=${workerMeeting.id})}"
               th:title="#{debtor.worker-meeting}" th:aria-label="#{debtor.worker-meeting}">
                <i class="fas fa-list"></i>
            </a>
            <button type="submit" class="btn btn-outline-success btn-sm" th:title="#{save}"
                    th:aria-label="#{save}"><i class="fas fa-save"></i></button>
            <button th:if="${isEdit}" type="button" class="btn btn-outline-danger btn-sm"
                    data-bs-toggle="modal" data-bs-target="#delete-modal" th:title="#{delete}"
                    th:aria-label="#{delete}"><i class="fas fa-trash"></i></button>
        </div>
    </form>
</main>

<div th:replace="~{fragments/delete-modal :: deleteModal(${isEdit}, '/debtors/' + ${workerMeeting.debtorId} + '/worker-meetings/' + ${workerMeeting.id} + '/participants/' + ${workerMeetingParticipant.id}, #{worker-meeting-participant.delete-title}, #{worker-meeting-participant.delete-confirm})}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
